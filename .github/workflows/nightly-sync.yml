name: Financy Morning Sync

on:
  schedule:
    # הרצה אוטומטית בכל יום ב-05:00 בבוקר UTC (לאחר הרענון של Financy)
    - cron: "0 5 * * *"
  workflow_dispatch: # מאפשר הרצה ידנית בלחיצת כפתור

jobs:
  sync-transactions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./server
        run: npx playwright install --with-deps chromium

      - name: Run Financy Sync
        working-directory: ./server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINANCY_STORAGE_STATE: ${{ secrets.FINANCY_STORAGE_STATE }}
        run: node sync-financy.js

      - name: Notify on failure
        if: failure()
        run: echo "Financy sync failed. Please check the logs."
